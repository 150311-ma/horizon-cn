name: Build Horizon CN

# 每天检查上游有没有新版本；有就重新构建并发布。也可以手动点 Run workflow。
on:
  schedule:
    # UTC 20:00 = 北京时间 04:00，这时候没人用
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── 上游版本 ────────────────────────────────────────────────
      # 已经发过的版本记在 release 的 tag 里；和上游最新一致就跳过，省掉一次构建。
      - name: 查上游最新版本
        id: upstream
        shell: bash
        run: |
          git ls-remote --tags --refs https://github.com/horizon-rust/horizon.git \
            | sed 's|.*refs/tags/||' \
            | grep -E '^launcher@[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 > tag.txt
          echo "tag=$(cat tag.txt)" >> "$GITHUB_OUTPUT"
          echo "上游最新：$(cat tag.txt)"

      - name: 这个版本构建过吗
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "cn-$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "已经发过 cn-$TAG，跳过"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 源码 ────────────────────────────────────────────────────
      - name: 取上游源码
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/horizon-rust/horizon.git upstream
          cd upstream
          git sparse-checkout init --cone
          # third_party 里有 libmimalloc-sys 这类被 patch 进来的本地 crate，游戏本体编不过就是因为缺它
          git sparse-checkout set crates launcher packaging tools xtask .cargo mods docs nix exporters third_party
          git checkout "${{ steps.upstream.outputs.tag }}"

      - name: 打补丁
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          cd upstream
          # 不用 --3way：partial clone（--filter=blob:none）里没有旧 blob，三方合并必然报
          # "lacks the necessary blob"。补丁是纯 LF，上下文匹配就够了。
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/horizon-cn.patch" \
            || { echo "::error::补丁打不上，上游这个版本的代码变了"; git apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/patches/horizon-cn.patch" || true; find . -name '*.rej' -exec sh -c 'echo "--- {} ---"; head -40 "{}"' \; ; exit 1; }

      # 推广位的图不在补丁里（二进制，diff 带不了），从本仓库复制过去
      - name: 放推广图与语言表
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          mkdir -p upstream/launcher/assets/promo
          cp assets/promo/* upstream/launcher/assets/promo/
          # 语言表整份覆盖：它改得太散（1371 → 1729 条），增量 diff 的上下文对不上上游新版本，
          # 而它本来就是一张完整表，直接给全文更可靠。
          cp files/launcher/lang/zh.json upstream/launcher/lang/zh.json
          cp files/horizon-client/assets/horizon/lang/zh_cn.json \
             upstream/crates/horizon-client/assets/horizon/lang/zh_cn.json
          ls -la upstream/launcher/assets/promo upstream/launcher/lang/zh.json

      # ── 构建 ────────────────────────────────────────────────────
      # 用 MinGW 而不是 MSVC：MSVC 编出来的 gpui 在用户机器上 DirectX 起不来
      # （`DirectWrite: 系统找不到指定的路径`，2026-11-19），同一个程序用 MinGW 编就能跑。
      - name: 装 MinGW 工具链
        if: steps.check.outputs.build == 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: 装 gnu Rust 工具链
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          # 整套用 gnu 工具链，而不是"MSVC 工具链 + gnu target"：后者 host 仍是 MSVC，
          # 依赖的 C 库（vswhom 等）被 gcc 编成 MinGW 格式后交给 link.exe，
          # 报 LNK1143 invalid or corrupt file。本机能跑的那个也是整套 gnu 编的。
          export PATH="$MSYS2_LOCATION/mingw64/bin:$PATH"
          rustup toolchain install 1.95.0-x86_64-pc-windows-gnu --profile minimal
          rustup run 1.95.0-x86_64-pc-windows-gnu rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.build == 'true'
        with:
          workspaces: |
            upstream
            upstream/launcher

      - name: 编译启动器
        if: steps.check.outputs.build == 'true'
        shell: bash
        working-directory: upstream
        run: |
          export PATH="$MSYS2_LOCATION/mingw64/bin:$PATH"
          gcc --version | head -1
          # debug-assertions 关掉着色器预编译，因此不需要 fxc.exe，MinGW 下也没有 fxc
          cargo +1.95.0-x86_64-pc-windows-gnu build \
            --manifest-path launcher/Cargo.toml --release \
            --config 'profile.release.debug-assertions=true' 2>&1 | tail -30

      # 游戏本体也编，而且必须和启动器同一个 commit：启动器靠版本目录里
      # crates/horizon-prepare 的 OUTPUT_VERSION 判断资源能不能用，两边对不上就会判
      # "资源不可用"，然后反复准备、最后启动不了（2026-11-19 就是这么崩的）。
      - name: 编译游戏本体
        if: steps.check.outputs.build == 'true'
        shell: bash
        working-directory: upstream
        run: |
          export PATH="$MSYS2_LOCATION/mingw64/bin:$PATH"
          cargo +1.95.0-x86_64-pc-windows-gnu build --release \
            --config 'profile.release.debug-assertions=true' \
            -p horizon-official -p horizon-prepare -p horizon-client-lib -p horizon-official-servers \
            2>&1 | tail -40

      # ── 打包 ────────────────────────────────────────────────────
      # 解压后是一个目录：启动器在根，游戏在 game/，把 game/ 整个放进
      # %APPDATA%\horizon-launcher\versions\ 下就能被认出来。
      - name: 组装
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          DEST="out/Horizon-CN-$TAG"
          mkdir -p "$DEST/game/crates" "$DEST/game/exporters"
          cp upstream/launcher/target/release/horizon-launcher.exe "$DEST/"
          G=upstream/target/release
          cp "$G/horizon-official.exe"         "$DEST/game/horizon-client.exe"
          cp "$G/horizon-prepare.exe"          "$DEST/game/horizon-prepare.exe"
          cp "$G/horizon-ctl.exe"              "$DEST/game/horizon-ctl.exe"
          cp "$G/horizon-official-servers.exe" "$DEST/game/horizon-server.exe" 2>/dev/null || true
          # 源码：启动器从 lib.rs 读 OUTPUT_VERSION，缺了就只能靠指纹表，表里没有就崩
          cp -r upstream/crates/horizon-prepare "$DEST/game/crates/"
          cp -r upstream/exporters/. "$DEST/game/exporters/" 2>/dev/null || true
          cp upstream/research-lock.json "$DEST/game/" 2>/dev/null || true
          : > "$DEST/game/.installed"
          cp README.md "$DEST/README.txt"
          cp -r assets/promo "$DEST/promo"
          echo "--- 目录 ---"
          ls -la "$DEST" "$DEST/game"

      - name: 打 zip
        if: steps.check.outputs.build == 'true'
        shell: pwsh
        run: |
          $TAG = "${{ steps.upstream.outputs.tag }}"
          Compress-Archive -Path "out/Horizon-CN-$TAG/*" -DestinationPath "Horizon-CN-$TAG.zip" -Force
          Get-Item "Horizon-CN-$TAG.zip" | Select-Object Name, Length

      - name: 发布
        if: steps.check.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          gh release create "cn-$TAG" "Horizon-CN-$TAG.zip" \
            --repo "${{ github.repository }}" \
            --title "Horizon 国产版 · $TAG" \
            --notes "基于上游 $TAG 构建，启动器与游戏同一 commit。

          **启动器**：下载与更新走国内镜像、界面完整中文、商店移除、推广位换成自己的轮播。
          **游戏**：界面底部一行推广条，所有页面可见。

          \`game/\` 整个放进 \`%APPDATA%\\horizon-launcher\\versions\\\` 下即可。

          $(gh release view "$TAG" --repo horizon-rust/horizon --json body -q .body 2>/dev/null | head -40)" \
            --latest
